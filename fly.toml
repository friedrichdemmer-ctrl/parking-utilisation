# fly.toml app configuration file generated for parking-utilisation on 2026-08-13T09:34:55+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'parking-utilisation'
primary_region = 'fra'

[build]
[env]
  PARKING_ARCHIVE_PATH = '/data/parking-data-archive'
  PARKING_DB_PATH = '/data/parking.db'

[[mounts]]
  source = 'parking_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '2gb'
