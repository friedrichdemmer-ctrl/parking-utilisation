# Fly.io app config. Rename `app` to something unique before first deploy.
app = "parking-utilisation-CHANGE-ME"
primary_region = "fra"  # Frankfurt -- closest to the German source data

[build]

[env]
  PARKING_DB_PATH = "/data/parking.db"
  PARKING_ARCHIVE_PATH = "/data/parking-data-archive"

[[mounts]]
  source = "parking_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
